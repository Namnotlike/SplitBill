name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Chỉ build + test — không deploy, không publish artifact. Deploy vẫn là quyết định thủ công
# (docker compose up --build, xem README.md/CLAUDE.md mục 10b), CI này chỉ chặn regression sớm.
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore SplitBill.sln

      - name: Build
        run: dotnet build SplitBill.sln --no-restore --configuration Release

      # SplitBill.IntegrationTests dùng EF Core InMemory (xem TestHarness.cs), KHÔNG cần SQL Server/
      # LocalDB thật — nên chạy được thẳng trên runner ubuntu-latest, không cần service container nào.
      - name: Test
        run: dotnet test SplitBill.sln --no-build --configuration Release --logger "console;verbosity=normal"
